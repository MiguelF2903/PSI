databases:
  - name: psi-db
    databaseName: psi
    user: psi_user

services:
  - type: web
    name: psi-p1
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn locallibrary.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.0
